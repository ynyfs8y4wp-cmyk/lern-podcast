<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' blob: https://dukunyhkzqtvczyjmlot.supabase.co; connect-src 'self' https://dukunyhkzqtvczyjmlot.supabase.co wss://dukunyhkzqtvczyjmlot.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hörspielwerkstatt</title>
<meta name="description" content="Persönliche Mutmach-Hörspiele für dein Kind.">
<meta name="apple-mobile-web-app-title" content="Hörspiele">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#22285E">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
</head>
<body>
<div class="wrap" id="app">
  <header class="sky">
    <span class="moon" aria-hidden="true"></span>
    <svg class="stars" aria-hidden="true" width="100%" height="100%"><g fill="#FFF4D6">
      <circle cx="9%" cy="16%" r="1.6"/><circle cx="26%" cy="8%" r="1.1"/><circle cx="44%" cy="20%" r="1.7"/><circle cx="58%" cy="9%" r="1.1"/><circle cx="66%" cy="30%" r="1.3"/><circle cx="18%" cy="36%" r="1.1"/><circle cx="52%" cy="40%" r="1"/><circle cx="4%" cy="52%" r="1.3"/><circle cx="36%" cy="54%" r="1"/></g></svg>
    <div class="top">
      <span class="over" data-t="over"></span>
      <label class="lang" for="uilang"><span data-t="appSprache"></span><select id="uilang"></select></label>
    </div>
    <h1 data-t="titel"></h1>
    <span class="ki" data-t="kiKopf"></span>
    <div class="chips-sky" id="stats"></div>
    <svg class="hills" id="hills" viewBox="0 0 400 96" aria-hidden="true"></svg>
  </header>

  <section class="intro" id="intro" hidden aria-labelledby="introTitle">
    <button class="skip" type="button" id="introSkip" data-t="ueberspringen"></button>
    <div class="slide" id="introSlide"></div>
    <div class="inav">
      <button class="back" type="button" id="introBack" data-t="zurueck"></button>
      <div class="dots" id="introDots"></div>
      <button class="cta" type="button" id="introNext"></button>
    </div>
  </section>

  <div class="tabs" role="tablist" id="tabs" hidden>
    <button role="tab" id="t-neu" data-tab="neu" data-t="tabNeu"></button>
    <button role="tab" id="t-lib" data-tab="lib"></button>
    <button role="tab" id="t-hilfe" data-tab="hilfe" data-t="tabHilfe"></button>
    <button role="tab" id="t-konto" data-tab="konto" data-t="tabKonto"></button>
  </div>
  <p class="err" id="err" role="alert" hidden></p>

  <!-- ANMELDEN -->
  <section id="v-login" hidden>
    <div class="panel">
      <div class="welcome" id="welcomeArt"></div>
      <h2 data-t="willkommen"></h2>
      <p class="lead" id="login-text" data-t="loginText"></p>
      <form id="f-pw" style="display:flex;flex-direction:column;gap:12px" hidden>
        <label class="f" for="pw-mail"><span data-t="email"></span><input id="pw-mail" type="email" autocomplete="email" required placeholder="name@example.com"></label>
        <label class="f" for="pw"><span data-t="passwort"></span><input id="pw" type="password" autocomplete="current-password" minlength="8" required></label>
        <button class="cta" type="submit" id="b-pw" data-t="einloggen"></button>
        <button class="ghost" type="button" id="b-neu" style="align-self:flex-start" data-t="kontoAnlegen"></button>
      </form>
      <form id="f-mail" style="display:flex;flex-direction:column;gap:12px">
        <label class="f" for="mail"><span data-t="email"></span><input id="mail" type="email" autocomplete="email" required placeholder="name@example.com"></label>
        <button class="cta" type="submit" id="b-mail" data-t="codeSchicken"></button>
      </form>
      <form id="f-code" style="display:flex;flex-direction:column;gap:12px" hidden>
        <label class="f" for="code"><span data-t="codeAusMail"></span><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="10" required placeholder="123456"></label>
        <button class="cta" type="submit" id="b-code" data-t="anmelden"></button>
        <button class="ghost" type="button" id="b-andere" style="align-self:flex-start" data-t="andereMail"></button>
      </form>
      <div class="or" id="oauth-oder"><span data-t="oder"></span></div>
      <div class="actions" id="oauth" style="justify-content:flex-start">
        <button type="button" id="b-apple" data-t="mitApple"></button>
        <button type="button" id="b-google" data-t="mitGoogle"></button>
      </div>
      <span class="hint" id="login-msg" role="status"></span>
    </div>
  </section>

  <!-- EINLADUNGSCODE -->
  <section id="v-invite" hidden>
    <div class="panel">
      <h2 data-t="einladung"></h2>
      <p class="lead" data-t="einladungText"></p>
      <form id="f-invite" style="display:flex;flex-direction:column;gap:12px">
        <label class="f" for="invite"><span data-t="code"></span><input id="invite" autocapitalize="characters" required placeholder="FAMILIE-1A2B3C"></label>
        <button class="cta" type="submit" data-t="freischalten"></button>
      </form>
      <span class="hint" id="invite-msg" role="status"></span>
      <button class="ghost" type="button" data-logout style="align-self:flex-start" data-t="abmelden"></button>
    </div>
  </section>

  <!-- EINWILLIGUNG (vor der ersten Bestellung und nach geänderten Bedingungen) -->
  <section id="v-einw" hidden>
    <div class="panel">
      <h2 data-t="einwTitel"></h2>
      <p class="lead" id="einw-lead"></p>
      <form id="f-einw" style="display:flex;flex-direction:column;gap:14px">
        <label class="check"><input type="checkbox" required><span><span data-t="einwAgb"></span> <a href="agb.html" target="_blank" data-t="agb"></a></span></label>
        <label class="check"><input type="checkbox" required><span><span data-t="einwDs"></span> <a href="datenschutz.html" target="_blank" data-t="datenschutz"></a></span></label>
        <label class="check"><input type="checkbox" required><span data-t="einwSensibel"></span></label>
        <label class="check"><input type="checkbox" required><span data-t="einwEltern"></span></label>
        <p class="ki" role="note" data-t="keinErsatz"></p>
        <button class="cta" type="submit" data-t="einwKnopf" style="align-self:flex-start"></button>
      </form>
      <span class="hint" id="einw-msg" role="status"></span>
      <button class="ghost" type="button" data-logout style="align-self:flex-start" data-t="abmelden"></button>
    </div>
  </section>

  <!-- NEUES HÖRSPIEL -->
  <section id="v-neu" hidden>
    <div id="wizard" class="wrap" style="max-width:none;gap:14px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span class="hint" id="stepn" style="font-weight:800"></span>
        <button class="ghost" type="button" id="reset" data-t="neuAnfangen"></button>
      </div>
      <nav class="steps" id="steps"></nav>

      <div class="panel" data-step="1">
        <h2 data-t="k1Titel"></h2>
        <p class="lead" data-t="k1Lead"></p>
        <div class="profiles" id="profiles"></div>
        <label class="f" for="kname"><span data-t="vorname"></span> <span class="hint" data-t="vornameHint"></span>
          <input id="kname" maxlength="40" autocomplete="off" data-ph="vornamePh"></label>
        <div style="display:flex;flex-direction:column;gap:8px"><span style="font-weight:700" data-t="alter"></span><div class="age" id="age" role="group"></div></div>
        <label class="f" for="kinfo"><span data-t="mag"></span> <span class="hint" data-t="magHint"></span>
          <textarea id="kinfo" maxlength="1500" data-ph="magPh"></textarea></label>
        <label class="toggle" for="ksave"><input type="checkbox" id="ksave" checked><span><span data-t="merken"></span> <span class="hint" data-t="merkenHint"></span></span></label>
        <div class="nav" data-nav="1"></div>
      </div>

      <div class="panel" data-step="2" hidden>
        <h2 data-t="k2Titel"></h2>
        <div class="fortbox" id="fortbox" hidden></div>
        <p class="lead" data-t="k2Lead"></p>
        <span class="counter" id="tcount"></span>
        <div id="themes" style="display:flex;flex-direction:column;gap:16px"></div>
        <label class="f" for="tfree"><span data-t="konkret"></span> <span class="hint" data-t="konkretHint"></span>
          <textarea id="tfree" maxlength="1500" data-ph="konkretPh"></textarea></label>
        <div style="display:flex;flex-direction:column;gap:8px"><span style="font-weight:700"><span data-t="mitspielen"></span> <span class="hint" style="font-weight:400" data-t="optional"></span></span><div class="chips" id="people"></div></div>
        <div class="nav" data-nav="2"></div>
      </div>

      <div class="panel" data-step="3" hidden>
        <h2 data-t="k3Titel"></h2>
        <p class="lead" data-t="k3Lead"></p>
        <div class="figs" id="figs"></div>
        <div class="editor" id="figedit" hidden></div>
        <div class="speechrow" id="speechrow" hidden><p class="speech" id="speech"></p><button type="button" class="soft" id="figeditbtn" hidden data-t="feBearbeiten"></button></div>
        <div style="display:flex;flex-direction:column;gap:8px" id="compbox"><span style="font-weight:700"><span data-t="begleiter"></span> <span class="hint" style="font-weight:400" data-t="begleiterHint"></span></span><div class="chips" id="companions"></div></div>
        <div class="nav" data-nav="3"></div>
      </div>

      <div class="panel" data-step="4" hidden>
        <h2 data-t="k4Titel"></h2>
        <p class="lead" data-t="k4Lead"></p>
        <div class="recommend" id="recbox"></div>
        <div class="concepts" id="concepts"></div>
        <div class="nav" data-nav="4"></div>
      </div>

      <div class="panel" data-step="5" hidden>
        <h2 data-t="k5Titel"></h2>
        <label class="f" for="outlang"><span data-t="hsSprache"></span> <span class="hint" data-t="hsSpracheHint"></span><select id="outlang"></select></label>
        <div style="display:flex;flex-direction:column;gap:8px"><span style="font-weight:700" data-t="laenge"></span><div class="choice" id="len"></div></div>
        <div style="display:flex;flex-direction:column;gap:8px"><span style="font-weight:700" data-t="stimmung"></span><div class="choice" id="mood"></div></div>
        <label class="toggle" for="sleep"><input type="checkbox" id="sleep"><span><span data-t="schlaf"></span> <span class="hint" data-t="schlafHint"></span></span></label>
        <label class="toggle" for="usename"><input type="checkbox" id="usename"><span data-t="mitName"></span></label>
        <details class="vbox" id="vbox"><summary><span data-t="stimmen"></span> <small id="vsum"></small></summary>
          <p class="hint" data-t="stimmenHint" style="margin-bottom:10px"></p><div class="voices" id="wvoices"></div><span class="hint" id="probemsg" role="status"></span></details>
        <div class="order" id="order"></div>
        <p class="hint" id="quota"></p>
        <div class="missing" id="missing" hidden></div>
        <p class="ki" role="note" data-t="kiBestellen"></p>
        <p class="ki" role="note" data-t="keinErsatz"></p>
        <div class="nav" data-nav="5"></div>
        <span class="hint" id="ordermsg" role="status"></span>
      </div>
    </div>
    <div id="success" class="panel" hidden><div class="done" id="donebox"></div></div>
    <section id="jobsec" hidden style="margin-top:20px;display:flex;flex-direction:column;gap:10px">
      <h3 data-t="inWerkstatt"></h3>
      <div class="jobs" id="jobs"></div>
    </section>
  </section>

  <section id="v-lib" hidden style="display:flex;flex-direction:column;gap:14px">
    <div class="libbar" id="libbar"><input id="libsuche" type="search" data-ph="suche" autocomplete="off"><div class="chips" id="libfilter"></div></div>
    <div id="lib"></div>
  </section>

  <article id="v-read" class="reader" hidden>
    <button type="button" id="rback" style="align-self:flex-start" data-t="bibZurueck"></button>
    <div class="rhead" id="rhead"></div>
    <div class="player-card" id="rplayer"></div>
    <div class="actions"><button class="cta" type="button" id="rfort" data-t="fortsetzen"></button><button class="soft" type="button" id="ragain" data-t="neuMitEinst"></button></div>
    <div class="series" id="rreihe" hidden></div>
    <details class="script" id="rfass" hidden><summary data-t="fassungen"></summary><div class="lines" id="rfasslist"></div></details>
    <p class="ki" role="note" id="rki"></p>
    <p class="ki" role="note" data-t="keinErsatz"></p>
    <div class="parents" id="rparents"></div>
    <details class="script" id="rvoices"><summary data-t="stimmenAnpassen"></summary>
      <div style="display:flex;flex-direction:column;gap:14px;margin-top:12px">
        <p class="hint" data-t="stimmenLead"></p>
        <div class="voices" id="rvlist" style="gap:16px"></div>
        <div class="actions" style="justify-content:flex-start"><button class="cta" type="button" id="rvsave" data-t="neuVertonen"></button><span class="hint" id="rvcount"></span></div>
        <p class="hint" id="rvmsg" role="status"></p>
      </div></details>
    <details class="script" id="rdet"><summary data-t="skript"></summary><div class="lines" id="rscript"></div></details>
    <div class="panel" id="rmeldung" hidden></div>
    <div id="rdelbox" class="actions"></div>
  </article>

  <section id="v-hilfe" hidden style="display:flex;flex-direction:column;gap:16px">
    <div class="panel">
      <h2 data-t="sofHelp"></h2>
      <p class="lead" data-t="sofText"></p>
      <button class="cta" type="button" id="introAgain" style="align-self:flex-start" data-t="introNochmal"></button>
    </div>
    <div class="panel">
      <h3 data-t="homeTitel"></h3>
      <p class="hint" data-t="homeText"></p>
    </div>
    <div class="faq" id="faq"></div>
  </section>

  <section id="v-konto" hidden style="display:flex;flex-direction:column;gap:16px">
    <div class="panel">
      <h2 data-t="deinKonto"></h2>
      <p id="konto-info"></p>
      <button type="button" data-logout style="align-self:flex-start" data-t="abmelden"></button>
      <a class="btn" id="adminlink" href="admin.html" hidden style="align-self:flex-start">Admin-Bereich</a>
    </div>
    <div class="panel" id="familie-box"><h3 data-t="eureFamilie"></h3><p class="hint" data-t="familieText"></p>
      <div class="row" style="gap:8px;flex-wrap:wrap;align-items:flex-end"><label class="f" style="flex:1;min-width:180px" for="fam-name"><span data-t="familieName"></span><input id="fam-name" maxlength="60"></label>
      <button type="button" class="soft" id="fam-speichern" data-t="speichern"></button></div>
      <ul id="fam-mitglieder" style="margin:8px 0 0;padding-left:20px"></ul><p class="hint" id="fam-code"></p></div>
    <div class="panel"><h3 data-t="kinderprofile"></h3><div id="kidlist"></div></div>
    <div class="panel">
      <h3 data-t="kontoLoeschen"></h3>
      <p class="hint" data-t="kontoLoeschenText"></p>
      <div id="delacc" class="actions" style="justify-content:flex-start"></div>
    </div>
    <p class="hint"><a href="agb.html" data-t="agb"></a> · <a href="datenschutz.html" data-t="datenschutz"></a> · <a href="impressum.html" data-t="impressum"></a></p>
  </section>
</div>
<script src="figuren.js"></script>
<script src="app.js"></script>
</body>
</html>
