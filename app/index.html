<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Hörspiele</title>
<meta name="apple-mobile-web-app-title" content="Hörspiele">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1F2A5E">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root{--night:#1F2A5E;--ink:#FFF4D6;--soft:#C9C3EA;--moon:#E8A93A}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:linear-gradient(#1C285C,#54468C);color:var(--ink);font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
       display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;
       padding:calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom))}
  img{width:120px;height:120px;border-radius:27px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
  h1{font:800 30px/1.1 Georgia,serif;margin:0}
  p{margin:0;color:var(--soft);max-width:30ch}
  a.go{display:inline-block;background:var(--moon);color:#1D2148;font-weight:700;text-decoration:none;padding:14px 26px;border-radius:999px}
  a.go:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
  .small{font-size:14px}
</style>
</head>
<body>
  <img src="icon-512.png" alt="">
  <h1>Hörspielwerkstatt</h1>
  <p id="msg">Öffne die Werkstatt …</p>
  <a class="go" id="go" href="https://claude.ai/artifact/GYXNEj1W3yTW4HpMsKbnzs">Werkstatt öffnen</a>
  <p class="small">Beim ersten Mal meldest du dich bei Claude an. Danach öffnet sich deine Werkstatt direkt.</p>
<script>
  // Startet die Werkstatt automatisch, wenn die App vom Home-Bildschirm geöffnet wird.
  var url = document.getElementById("go").href;
  var standalone = window.navigator.standalone === true || window.matchMedia("(display-mode: standalone)").matches;
  if (standalone) { setTimeout(function(){ location.replace(url); }, 400); }
  else { document.getElementById("msg").textContent = "Lege diese Seite in Safari über Teilen → „Zum Home-Bildschirm“ als App ab."; }
</script>
</body>
</html>
