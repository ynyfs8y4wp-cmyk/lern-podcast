# Lern-Podcast: macht aus jedem neuen Lernschnipsel und jedem Hörspiel eine MP3-Folge
# und veröffentlicht zwei Podcast-Feeds, den du in deiner Podcast-App abonnierst.
name: Lern-Podcast

on:
  push:                      # WANN: sobald eine neue Folge als Text ins Repo kommt
    branches: [main]
    paths: ["episodes/**.md", "hoerspiele/**.enc", "app/**", "werkstatt/**", "lernroute/**"]
  workflow_dispatch:         # oder per Hand über den Button "Run workflow"
    inputs:
      neu:
        description: "Folgen-IDs, die neu eingesprochen werden sollen (mit Leerzeichen getrennt)"
        required: false
        default: ""

permissions:
  contents: write            # MP3 als Release ablegen, Metadaten speichern
  pages: write               # Feed auf GitHub Pages veröffentlichen
  id-token: write

concurrency:
  group: lern-podcast
  cancel-in-progress: false

jobs:
  podcast:
    runs-on: ubuntu-latest   # WO: eine frische Linux-VM von GitHub
    timeout-minutes: 90      # hängt etwas, bricht der Lauf ab, statt alle folgenden Läufe stundenlang zu blockieren
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ffmpeg (fertige Version, ohne Paketquellen)
        id: ffmpeg
        continue-on-error: true
        timeout-minutes: 4
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release

      - name: ffmpeg installieren (Ersatz, falls oben nicht geklappt)
        timeout-minutes: 12
        run: |
          command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null && { echo "ffmpeg vorhanden"; exit 0; }
          for v in 1 2; do
            timeout 120 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq \
              && timeout 240 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y -qq --no-install-recommends ffmpeg && exit 0
            echo "::warning::Paketinstallation hing (Versuch $v)"; sleep 10
          done
          exit 1

      - name: Deutsche Stimme aus dem Zwischenspeicher holen
        uses: actions/cache@v4
        with:
          path: voice
          key: piper-voice-${{ vars.PIPER_VOICE || 'de_DE-thorsten-high' }}

      - name: Deutsche Stimme herunterladen (nur beim ersten Mal)
        env:
          VOICE: ${{ vars.PIPER_VOICE || 'de_DE-thorsten-high' }}
        run: |
          mkdir -p voice
          if [ ! -f "voice/$VOICE.onnx" ]; then
            IFS='-' read -r LANG NAME QUALITY <<< "$VOICE"
            BASE="https://huggingface.co/rhasspy/piper-voices/resolve/main/${LANG%%_*}/$LANG/$NAME/$QUALITY"
            curl -sSfL -o "voice/$VOICE.onnx" "$BASE/$VOICE.onnx"
            curl -sSfL -o "voice/$VOICE.onnx.json" "$BASE/$VOICE.onnx.json"
          fi

      - name: Sprachsoftware installieren
        run: pip install -q "piper-tts==1.3.0" "Pillow==11.3.0"

      - name: Neue Folgen einsprechen und Feed bauen
        env:
          GH_TOKEN: ${{ github.token }}
          PIPER_VOICE: ${{ vars.PIPER_VOICE || 'de_DE-thorsten-high' }}
          PODCAST_TITLE: ${{ vars.PODCAST_TITLE || 'Lernroute Agentifizierung' }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVEN_MODEL: ${{ vars.ELEVEN_MODEL }}
          ELEVEN_VOICE_ANNA: ${{ vars.ELEVEN_VOICE_ANNA }}
          ELEVEN_VOICE_BEN: ${{ vars.ELEVEN_VOICE_BEN }}
          HOERSPIEL_TITLE: ${{ vars.HOERSPIEL_TITLE || 'Hörspielwerkstatt' }}
          HOERSPIEL_VOICES: ${{ vars.HOERSPIEL_VOICES }}
          HOERSPIEL_GEHEIMNIS: ${{ secrets.HOERSPIEL_GEHEIMNIS }}   # Schlüssel für Skripte und Audio, ergibt auch den Feed-Pfad
          HOERSPIEL_MODEL: ${{ vars.HOERSPIEL_MODEL }}
          HOERSPIEL_SFX: ${{ vars.HOERSPIEL_SFX }}
          HOERSPIEL_DIALOG_MODELLE: ${{ vars.HOERSPIEL_DIALOG_MODELLE }}   # Standard: eleven_v4,eleven_v3
          HOERSPIEL_MUSIK: ${{ vars.HOERSPIEL_MUSIK }}                     # "aus" schaltet Erkennungsmelodie und Musikteppich ab
          REDO: ${{ github.event.inputs.neu }}
        run: python scripts/build.py

      - name: Metadaten der neuen Folgen speichern
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          for f in episodes/*.json hoerspiele/*.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          git diff --cached --quiet || git commit -m "Neue Podcast-Folgen [skip ci]"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done

      - name: GitHub Pages vorbereiten
        uses: actions/configure-pages@v5

      - name: Feed hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Feed veröffentlichen
        id: deploy
        uses: actions/deploy-pages@v4
